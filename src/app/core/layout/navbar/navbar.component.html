<!-- Desktop Navigation -->
<nav id="navDesktop" class="desktop-nav">
  <div class="nav-brand">
    <button
      routerLink="/"
      class="home-button"
      aria-label="Ir al inicio"
      mat-mini-fab
    >
      <mat-icon>home</mat-icon>
    </button>
  </div>

  <ul class="nav-links">
    <li>
      <a
        routerLink="/indicemasa"
        routerLinkActive="active"
        class="nav-link"
        [routerLinkActiveOptions]="{ exact: false }"
      >
        <mat-icon class="nav-icon">calculate</mat-icon>
        <span class="nav-text">Calcular IMC</span>
      </a>
    </li>
    <li>
      <a
        routerLink="/entrenadores"
        routerLinkActive="active"
        class="nav-link"
        [routerLinkActiveOptions]="{ exact: false }"
      >
        <mat-icon class="nav-icon">fitness_center</mat-icon>
        <span class="nav-text">Entrenadores</span>
      </a>
    </li>
  </ul>

  <button
    (click)="toggleDarkMode()"
    class="theme-toggle"
    mat-mini-fab
    aria-label="Cambiar tema"
  >
    <mat-icon>{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>
</nav>

<!-- Mobile Navigation -->
<nav id="navMobile" class="mobile-nav" [class.expanded]="isMenuExpanded">
  <!-- Expandable Menu Section -->
  <div class="mobile-menu-expanded" [class.visible]="isMenuExpanded">
    <div class="menu-content">
      <h3 class="menu-title">Navegación</h3>
      <a
        routerLink="/"
        (click)="closeMenu()"
        class="menu-item"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <mat-icon>home</mat-icon>
        <span>Inicio</span>
      </a>
      <a
        routerLink="/indicemasa"
        (click)="closeMenu()"
        class="menu-item"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: false }"
      >
        <mat-icon>calculate</mat-icon>
        <span>Calcular IMC</span>
      </a>
      <a
        routerLink="/entrenadores"
        (click)="closeMenu()"
        class="menu-item"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: false }"
      >
        <mat-icon>fitness_center</mat-icon>
        <span>Entrenadores</span>
      </a>
      <button
        (click)="toggleDarkMode()"
        class="theme-toggle-item"
        aria-label="Cambiar tema"
      >
        <mat-icon>{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</mat-icon>
        <span>{{ isDarkMode ? 'Modo claro' : 'Modo oscuro' }}</span>
      </button>
    </div>
  </div>

  <!-- Bottom Handle Bar (Only visible element) -->
  <div class="mobile-nav-bar">
    <div class="nav-handle" (click)="toggleMenu()">
      <div class="handle-bar"></div>
    </div>
  </div>
</nav>
