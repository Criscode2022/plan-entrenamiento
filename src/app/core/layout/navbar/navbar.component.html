<!-- Desktop Navigation -->
<nav id="navDesktop" class="desktop-nav">
  <div class="nav-brand">
    <button
      routerLink="/"
      class="home-button"
      aria-label="Ir al inicio"
      mat-mini-fab
    >
      <mat-icon>home</mat-icon>
    </button>
  </div>

  <ul class="nav-links">
    <li>
      <a
        routerLink="/indicemasa"
        routerLinkActive="active"
        class="nav-link"
        [routerLinkActiveOptions]="{ exact: false }"
      >
        <mat-icon class="nav-icon">calculate</mat-icon>
        <span class="nav-text">Calcular IMC</span>
      </a>
    </li>
    <li>
      <a
        routerLink="/entrenadores"
        routerLinkActive="active"
        class="nav-link"
        [routerLinkActiveOptions]="{ exact: false }"
      >
        <mat-icon class="nav-icon">fitness_center</mat-icon>
        <span class="nav-text">Entrenadores</span>
      </a>
    </li>
  </ul>

  <button
    (click)="toggleDarkMode()"
    class="theme-toggle"
    mat-mini-fab
    aria-label="Cambiar tema"
  >
    <mat-icon>{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>
</nav>

<!-- Mobile Navigation -->
<nav id="navMobile" class="mobile-nav">
  <button
    routerLink="/"
    class="mobile-home-button"
    mat-fab
    aria-label="Ir al inicio"
  >
    <mat-icon>home</mat-icon>
  </button>

  <button
    (click)="toggleGroup()"
    class="mobile-menu-button"
    mat-fab
    aria-label="Abrir menú"
  >
    <mat-icon>{{ isHidden ? 'close' : 'menu' }}</mat-icon>
  </button>

  <button
    (click)="toggleDarkMode()"
    class="mobile-theme-button"
    mat-fab
    aria-label="Cambiar tema"
  >
    <mat-icon>{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>

  <div *ngIf="isHidden" class="mobile-menu animate-slide-down">
    <a
      routerLink="/indicemasa"
      (click)="toggleGroup()"
      class="mobile-menu-item"
    >
      <mat-icon>calculate</mat-icon>
      <span>Calcular IMC</span>
    </a>
    <a
      routerLink="/entrenadores"
      (click)="toggleGroup()"
      class="mobile-menu-item"
    >
      <mat-icon>fitness_center</mat-icon>
      <span>Entrenadores</span>
    </a>
  </div>
</nav>
